<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Werkstadt</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#5bb04a;font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#bar{position:fixed;top:12px;right:12px;display:flex;gap:6px}
#bar button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:7px 12px;background:#fffffff0;color:#222;box-shadow:0 2px 0 #0003;cursor:pointer}
#bar button.on{background:#f2c230}
#card,#legend{position:fixed;left:12px;bottom:54px;max-width:340px;background:#fffffff5;border-radius:14px;padding:12px 14px;box-shadow:0 3px 0 #0003,0 8px 24px #0002;color:#222;display:none}
#ticker{position:fixed;left:12px;right:12px;bottom:10px;background:#fffffff0;border-radius:12px;padding:7px 0;box-shadow:0 3px 0 #0003;color:#222;display:none;font-size:12.5px;overflow:hidden;white-space:nowrap}
#ticker .track{display:inline-block;animation:tick linear infinite;will-change:transform}
#ticker .it{display:inline-block;margin-right:42px}
#ticker .it::before{content:'●';color:var(--c);margin-right:7px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#legend{left:auto;right:12px;top:56px;bottom:auto;max-height:calc(100vh - 80px);overflow:auto;width:320px}
#card b,#legend b{font-size:14px}
#card .k,#legend .k{color:#666}
#legend div{margin:6px 0}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#status{position:fixed;left:12px;top:12px;background:#fffffff0;border-radius:10px;padding:6px 10px;font-weight:600;box-shadow:0 2px 0 #0003}
body.tv #bar,body.tv #legend{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Werkstadt …</div>
<div id="bar"><button id="bAuto" class="on">Auto</button><button id="bDay"></button><button id="bNight"></button><button id="bLeg">?</button></div>
<div id="card"></div><div id="ticker"></div>
<div id="legend"></div>
<script>
// ---------- Grundlagen ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const PAL=['#d33a2c','#2a6fd6','#f2c230','#2bb3a3','#8e5bc4','#f08a24','#9bc53d','#e86aa6','#4b5d82'];
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const colOf=s=>PAL[hash(s)%PAL.length];
const seeded=s=>()=>(s=(s*9301+49297)%233280)/233280;
function shade(hex,a){if(hex[0]!='#')return hex;const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return `rgb(${f(r)},${f(g)},${f(b)})`}
const PLATE={gross:'#b8bcc4',stadt:'#e3d3a8',dorf:'#7cc95a',oss:'#8fd6cc',werk:'#8c8f96',park:'#6cbd52'};
// Sprache: Browsersprache, übersteuerbar mit ?lang=de oder ?lang=en
const QS=new URLSearchParams(location.search),DE=(QS.get('lang')||navigator.language||'en').toLowerCase().startsWith('de'),LOC=DE?'de':'en',X=(de,en)=>DE?de:en;
document.documentElement.lang=LOC;
const TIER={gross:X('Großstadt','Metropolis'),stadt:X('Stadt','Town'),dorf:X('Dorf','Village'),oss:'Open Source',werk:X('Werk','Factory')};
document.getElementById('bDay').textContent=X('Tag','Day');document.getElementById('bNight').textContent=X('Nacht','Night');
document.getElementById('legend').innerHTML=`<b>${X('Was du siehst','What you see')}</b>`+[
 ['#b8bcc4',TIER.gross,X('ab 1.000 Dateien oder 500 Commits/Monat, nimmt 2×2 Blöcke ein','from 1,000 files or 500 commits a month, takes 2×2 blocks')],
 ['#e3d3a8',TIER.stadt,X('400–1.000 Dateien, 2 Blöcke','400–1,000 files, 2 blocks')],
 ['#7cc95a',TIER.dorf,X('Häuser mit Satteldach, Felder; liegt außerhalb des Rings','pitched roofs and fields; lies outside the ring')],
 ['#8fd6cc',X('Open-Source-Kern','Open-source core'),X('Leuchtturm, liegt nah am Hafen','lighthouse, close to the harbour')],
 ['#8c8f96',TIER.werk,X('gemeinsames Werkzeug-Repo, Fabrik mit Schornstein','shared tooling repo, factory with a chimney')],
 ['#f08a24',X('Baustelle','Construction site'),X('offene Worktrees','open worktrees')],
 ['#ffd36b',X('Aktivität','Activity'),X('aktiv = Sitzung arbeitet oder Commit < 30 min: Kran dreht schnell, Warnlicht blinkt, nachts fast alle Lichter an. Kürzlich = offene Änderungen oder Commit < 3 h: Kran dreht langsam, einige Lichter. Sonst dunkel.','active = session working or commit < 30 min: crane turns fast, beacon blinks, most lights on at night. Recent = uncommitted changes or commit < 3 h: crane turns slowly, some lights. Otherwise dark.')],
 ['#2a6fd6',X('Autos','Cars'),X('jeder neue Commit genau eine Fahrt: vom Zubringer zum Kern, sonst eine Runde um die eigene Stadt; Farbe = Herkunft','each new commit is exactly one trip: feeder to core, otherwise one lap around its own town; colour = origin')],
 ['#f2c230',X('Züge','Trains'),X('laufende CI fährt im Kreis, rote CI steht auf dem Abstellgleis; Pendelzüge fahren nur bei Commits der letzten 10 min','running CI circles the ring, failed CI sits on the siding; shuttle trains only move after commits in the last 10 min')],
 ['#5f6b82',X('Unwetter','Storm'),X('nur über Städten mit roter CI','only over towns with failed CI')],
 ['#f2f2ee',X('Figuren','Figures'),X('Claude-Sitzungen: blau arbeitet, orange „!“ wartet auf dich, grau schläft','Claude sessions: blue is working, orange "!" waits for you, grey is idle')],
 ['#d33a2c',X('Hafen','Harbour'),X('Schiffe = Images, Container am Kai = Docker-Container','ships = images, containers on the quay = Docker containers')],
 ['#c9d3e6',X('Satelliten','Satellites'),X('Releases der letzten 14 Tage','releases of the last 14 days')],
].map(([c,a,b])=>`<div><i style="background:${c}"></i><b>${a}</b> <span class="k">${b.replace(/</g,'&lt;')}</span></div>`).join('');
let W,H,DPR,T,cols,rows,offX,offY,B=5,G={},ST=null,lastKey='',nightMode='auto',hit=[],sel=null;
const stat=document.createElement('canvas'),lightC=document.createElement('canvas');
if(new URLSearchParams(location.search).has('tv'))document.body.classList.add('tv');
const isNight=()=>nightMode=='night'||(nightMode=='auto'&&((h)=>h<7||h>=18)(new Date().getHours()));

function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function stud(c,x,y,r,col){c.fillStyle=shade(col,-.28);c.beginPath();c.arc(x+r*.15,y+r*.2,r,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle=shade(col,.32);c.beginPath();c.arc(x-r*.28,y-r*.28,r*.42,0,7);c.fill()}
function studs(c,x,y,w,h,col,step=T){const r=step*.26;for(let yy=y+step/2;yy<y+h;yy+=step)for(let xx=x+step/2;xx<x+w;xx+=step)stud(c,xx,yy,r,col)}
// Stein von oben: Schatten nach rechts unten je nach Höhe, Kante, Noppen
function brick(c,x,y,w,h,col,ht=1,withStuds=true){
  const s=ht*T*.12;c.fillStyle='rgba(0,0,0,.22)';rr(c,x+s,y+s,w,h,3);c.fill();
  c.fillStyle=col;rr(c,x,y,w,h,3);c.fill();
  c.lineWidth=2;c.strokeStyle=shade(col,.25);c.beginPath();c.moveTo(x+2,y+h-2);c.lineTo(x+2,y+2);c.lineTo(x+w-2,y+2);c.stroke();
  c.strokeStyle=shade(col,-.25);c.beginPath();c.moveTo(x+w-1,y+2);c.lineTo(x+w-1,y+h-1);c.lineTo(x+2,y+h-1);c.stroke();
  if(withStuds)studs(c,x,y,w,h,col,T*.5>8?T/2:T);
}
function tree(c,x,y,r){c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.arc(x+r*.35,y+r*.4,r,0,7);c.fill();stud(c,x,y,r,'#2e8b3a');stud(c,x-r*.2,y-r*.2,r*.45,'#3fa34a')}

// ---------- Layout ----------
function layout(){
  DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  const repos=visibleRepos(),inner=repos.filter(r=>['gross','stadt','werk'].includes(r.tier)),outer=repos.filter(r=>!['gross','stadt','werk'].includes(r.tier));
  const need=inner.reduce((a,r)=>a+(r.tier=='gross'?4:r.tier=='stadt'?2:1),0)+1;
  const cap=(nc,nr)=>{const gw=nc*(B+1)+1,gh=nr*(B+1)+1;return 2*(Math.floor((gh-B)/(B+2))+1)+Math.floor((gw-B)/(B+2))+1};
  let best=null;
  for(let nc=2;nc<=10;nc++)for(let nr=2;nr<=6;nr++){const over=Math.max(0,outer.length-cap(nc,nr));if(nc*nr<need+over)continue;
    const gw=nc*(B+1)+1,gh=nr*(B+1)+1,t=Math.min(34,Math.floor(W/(gw+2*(B+7))),Math.floor((H-44)/(gh+B+6+9)));
    const waste=nc*nr-need-over,score=t*(1-.04*waste);if(!best||score>best.score)best={t,nc,nr,score}}
  if(!best)best={t:10,nc:Math.max(2,Math.floor((W/10-2*(B+6)-1)/(B+1))),nr:Math.max(2,Math.floor((H/10-(B+6)-9)/(B+1)))};
  T=Math.max(10,best.t);G.nc=best.nc;G.nr=best.nr;cols=Math.floor(W/T);rows=Math.floor(H/T);
  offX=Math.floor((W-cols*T)/2);offY=Math.floor((H-rows*T)/2);
  G.gw=G.nc*(B+1)+1;G.gh=G.nr*(B+1)+1;
  G.ox=Math.floor((cols-G.gw)/2);G.oy=B+5;
  G.ring={x0:G.ox-2,y0:G.oy-2,x1:G.ox+G.gw+1,y1:G.oy+G.gh+1};
  G.quayY=G.ring.y1+2;G.waterY=G.quayY+2;G.hx=G.ox+(B+1)*Math.floor(G.nc/2);
  G.plots=[];G.overflow=0;G.spurs=[];
  // Außenorte: links/rechts an den Seiten, oben in einer Reihe; Kerne möglichst unten (nah am Hafen)
  const free=[];
  for(let y=G.oy;y+B<=G.oy+G.gh;y+=B+2){free.push({side:'l',tx:G.ox-B-6,ty:y});free.push({side:'r',tx:G.ox+G.gw+6,ty:y})}
  for(let x=G.ox;x+B<=G.ox+G.gw;x+=B+2)free.push({side:'t',tx:x,ty:1});
  const pick=pref=>{free.sort(pref);return free.shift()};const inward=[];
  for(const r of [...outer].sort((a,b)=>(a.tier=='oss'?0:1)-(b.tier=='oss'?0:1)||b.files-a.files)){if(!free.length){inward.push(r);continue}
    const s0=pick(r.tier=='oss'?(a,b)=>(a.side=='t')-(b.side=='t')||b.ty-a.ty:(a,b)=>(a.side=='t'?0:1)-(b.side=='t'?0:1)||a.ty-b.ty);
    const p={r,tx:s0.tx,ty:s0.ty,tw:B,th:B,side:s0.side,outer:true};
    if(s0.side=='l'){p.door=[p.tx+B,p.ty+1];p.inside=[p.tx+B-1,p.ty+1];p.road=[[p.tx+B,p.ty+1],[G.ox,p.ty+1]];p.spur={x0:(p.tx+B)*T,y0:(p.ty+3.5)*T,x1:(G.ring.x0+.5)*T,y1:(p.ty+3.5)*T}}
    else if(s0.side=='r'){p.door=[p.tx-1,p.ty+1];p.inside=[p.tx,p.ty+1];p.road=[[G.ox+G.gw-1,p.ty+1],[p.tx-1,p.ty+1]];p.spur={x0:p.tx*T,y0:(p.ty+3.5)*T,x1:(G.ring.x1+.5)*T,y1:(p.ty+3.5)*T}}
    else{p.door=[p.tx+1,p.ty+B];p.inside=[p.tx+1,p.ty+B-1];p.road=[[p.tx+1,p.ty+B],[p.tx+1,G.oy]];p.spur={x0:(p.tx+3.5)*T,y0:(p.ty+B)*T,x1:(p.tx+3.5)*T,y1:(G.ring.y0+.5)*T}}
    G.plots.push(p);G.spurs.push({p,...p.spur,col:colOf(r.id)})}
  // Blöcke im Ring: groß zuerst zur Mitte, übrige Außenorte in freie Blöcke, Rest wird Park
  const occ=Array.from({length:G.nr},()=>Array(G.nc).fill(null));
  const order={gross:0,stadt:1,werk:2,oss:3,dorf:4},cx=(G.nc-1)/2,cy=(G.nr-1)/2;
  for(const r of [...inner,...inward].sort((a,b)=>order[a.tier]-order[b.tier]||b.files-a.files)){
    const sizes=r.tier=='gross'?[[2,2],[2,1],[1,1]]:r.tier=='stadt'?[[2,1],[1,2],[1,1]]:[[1,1]];let placed=false;
    for(const [sw,sh] of sizes){
      const cand=[];for(let y=0;y+sh<=G.nr;y++)for(let x=0;x+sw<=G.nc;x++)cand.push([x,y]);
      const dist=a=>Math.hypot(a[0]+sw/2-.5-cx,a[1]+sh/2-.5-cy);
      cand.sort((a,b)=>sw*sh>1?dist(a)-dist(b):dist(b)-dist(a));
      for(const [x,y] of cand){let ok=true;for(let j=0;j<sh&&ok;j++)for(let i=0;i<sw;i++)if(occ[y+j][x+i])ok=false;
        if(ok){const q={r,c:x,rw:y,sw,sh};for(let j=0;j<sh;j++)for(let i=0;i<sw;i++)occ[y+j][x+i]=q;G.plots.push(q);placed=true;break}}
      if(placed)break}
    if(!placed)G.overflow++}
  for(let y=0;y<G.nr;y++)for(let x=0;x<G.nc;x++)if(!occ[y][x]){const q={park:true,c:x,rw:y,sw:1,sh:1};occ[y][x]=q;G.plots.push(q)}
  G.plots.forEach(p=>{if(p.outer)return;p.tx=G.ox+p.c*(B+1)+1;p.ty=G.oy+p.rw*(B+1)+1;p.tw=p.sw*(B+1)-1;p.th=p.sh*(B+1)-1;
    p.door=[p.tx+Math.floor(p.tw/2),p.ty+p.th];p.inside=[p.door[0],p.door[1]-1]});
  G.plots.forEach(p=>{p.x=p.tx*T;p.y=p.ty*T;p.w=p.tw*T;p.h=p.th*T});
  G.byId={};G.plots.forEach(p=>{if(p.r)G.byId[p.r.id]=p});
  const road=new Set();
  for(let ty=G.oy;ty<G.oy+G.gh;ty++)for(let tx=G.ox;tx<G.ox+G.gw;tx++){
    const onRow=(ty-G.oy)%(B+1)==0,onCol=(tx-G.ox)%(B+1)==0;if(!onRow&&!onCol)continue;
    if(G.plots.some(p=>!p.outer&&tx>=p.tx&&tx<p.tx+p.tw&&ty>=p.ty&&ty<p.ty+p.th))continue;road.add(tx+','+ty)}
  for(let ty=G.oy+G.gh;ty<=G.ring.y1+1;ty++)road.add(G.hx+','+ty);
  G.crossings=[[G.hx,G.ring.y1,'h']];
  G.plots.filter(p=>p.outer).forEach(p=>{const [a,b]=p.road;for(let x=Math.min(a[0],b[0]);x<=Math.max(a[0],b[0]);x++)for(let y=Math.min(a[1],b[1]);y<=Math.max(a[1],b[1]);y++)road.add(x+','+y);
    if(p.side=='l')G.crossings.push([G.ring.x0,p.ty+1,'v']);else if(p.side=='r')G.crossings.push([G.ring.x1,p.ty+1,'v']);else G.crossings.push([p.tx+1,G.ring.y0,'h'])});
  G.road=road;
  buildRoutes();buildStatic();
}
function visibleRepos(){return ST?ST.repos.filter(r=>(r.commits>0&&r.files>=20)||r.tier=='oss'||r.tier=='werk'):[]}

// ---------- Routen: Dijkstra mit Abbiegestrafe, dann Ecken, dann rechte Spur ----------
function route(a,b){
  const K=(x,y)=>x+','+y,D=[[1,0],[0,1],[-1,0],[0,-1]];const dist=new Map(),prev=new Map(),q=[];
  for(let d=0;d<4;d++){dist.set(K(a[0],a[1])+'|'+d,0);q.push([0,a[0],a[1],d])}
  let end=null;
  while(q.length){q.sort((x,y)=>x[0]-y[0]);const [c,x,y,d]=q.shift();const key=K(x,y)+'|'+d;if(c>dist.get(key))continue;
    if(x==b[0]&&y==b[1]){end=key;break}
    for(let nd=0;nd<4;nd++){if(nd==(d+2)%4)continue;const nx=x+D[nd][0],ny=y+D[nd][1];if(!G.road.has(K(nx,ny)))continue;
      const nc=c+1+(nd!=d?4:0),nk=K(nx,ny)+'|'+nd;if(nc<(dist.get(nk)??1e9)){dist.set(nk,nc);prev.set(nk,key);q.push([nc,nx,ny,nd])}}}
  if(!end)return null;const pts=[];let k=end;while(k){const [xy]=k.split('|');pts.unshift(xy.split(',').map(Number));k=prev.get(k)}
  return pts}
function corners(p){const o=[p[0]];for(let i=1;i<p.length-1;i++){const a=p[i-1],b=p[i],c=p[i+1];if((b[0]-a[0])!=(c[0]-b[0])||(b[1]-a[1])!=(c[1]-b[1]))o.push(b)}o.push(p[p.length-1]);return o}
function laneOffset(pts,off){const n=(a,b)=>{const dx=Math.sign(b[0]-a[0]),dy=Math.sign(b[1]-a[1]);return [-dy,dx]};
  return pts.map((p,i)=>{let nx=0,ny=0;if(i>0){const m=n(pts[i-1],p);nx+=m[0];ny+=m[1]}if(i<pts.length-1){const m=n(p,pts[i+1]);nx+=m[0];ny+=m[1]}
    return [p[0]+nx*off,p[1]+ny*off]})}
function polyLen(p){let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s}
function along(p,s){for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(s<=l)return [a[0]+(b[0]-a[0])*s/l,a[1]+(b[1]-a[1])*s/l,Math.atan2(b[1]-a[1],b[0]-a[0])];s-=l}const z=p[p.length-1];return [z[0],z[1],0]}
function buildRoutes(){
  G.routes=[];if(!ST)return;
  
  for(const [a,b,n,truck] of ST.links){const A=G.byId[a],Bp=G.byId[b];if(!A||!Bp)continue;
    const t=route(A.door,Bp.door);if(!t)continue;
    const px=corners([A.inside,...t,Bp.inside]).map(([x,y])=>[(x+.5)*T,(y+.5)*T]);
    const lane=laneOffset(px,T*.22);G.routes.push({a,b,n,truck,pts:lane,len:polyLen(lane),col:colOf(a)})}
}

// ---------- Statische Ebene ----------
function buildStatic(){
  for(const c of [stat,lightC]){c.width=cols*T*DPR;c.height=rows*T*DPR}
  const c=stat.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);
  const L=lightC.getContext('2d');L.setTransform(DPR,0,0,DPR,0,0);L.clearRect(0,0,cols*T,rows*T);
  // Grundplatte
  c.fillStyle='#5bb04a';c.fillRect(0,0,cols*T,rows*T);studs(c,0,0,cols*T,rows*T,'#5bb04a');
  // Wasser + Kai
  c.fillStyle='#2f8fd8';c.fillRect(0,G.waterY*T,cols*T,(rows-G.waterY)*T);studs(c,0,G.waterY*T,cols*T,(rows-G.waterY)*T,'#2f8fd8');
  c.fillStyle='#a9adb4';c.fillRect(0,G.quayY*T,cols*T,2*T);studs(c,0,G.quayY*T,cols*T,2*T,'#a9adb4');
  c.fillStyle='#e8c33a';for(let x=0;x<cols*T;x+=T)c.fillRect(x,G.waterY*T-3,T/2,3);
  // Straßen
  for(const k of G.road){const [x,y]=k.split(',').map(Number);c.fillStyle='#5d6169';c.fillRect(x*T,y*T,T,T)}
  c.fillStyle='#f4f4f0';
  for(const k of G.road){const [x,y]=k.split(',').map(Number);const h=G.road.has((x-1)+','+y)||G.road.has((x+1)+','+y),v=G.road.has(x+','+(y-1))||G.road.has(x+','+(y+1));
    if(h&&!v)c.fillRect(x*T+T*.2,y*T+T/2-1,T*.6,2);else if(v&&!h)c.fillRect(x*T+T/2-1,y*T+T*.2,2,T*.6);
    else if(h&&v){c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x*T+3,y*T+3,T-6,T-6);c.fillStyle='#f4f4f0'}}
  // Gleisring
  const R=G.ring,x0=(R.x0+.5)*T,y0=(R.y0+.5)*T,x1=(R.x1+.5)*T,y1=(R.y1+.5)*T,rad=1.6*T;G.rail={x0,y0,x1,y1,rad};
  const ringPath=(o)=>{c.beginPath();c.roundRect(x0-o,y0-o,x1-x0+2*o,y1-y0+2*o,Math.max(2,rad+o))};
  c.strokeStyle='#9b8a72';c.lineWidth=T*.95;ringPath(0);c.stroke();
  G.railLen=railLength();c.fillStyle='#6b4a2f';for(let s=0;s<G.railLen;s+=T*.42){const [x,y,a]=railPos(s);c.save();c.translate(x,y);c.rotate(a);c.fillRect(-2,-T*.36,4,T*.72);c.restore()}
  c.strokeStyle='#c7ccd3';c.lineWidth=2.4;ringPath(T*.2);c.stroke();ringPath(-T*.2);c.stroke();
  // Abstellgleis oben

  const key=JSON.stringify([st.repos.map(r=>[r.id,r.tier,r.worktrees,r.today>0]),st.links]);ST=st;
  if(key!=lastKey){lastKey=key;layout()}
  ingest(st.events||[]);
  s.textContent='Werkstadt · '+(DEMO?'Demo · ':'')+new Date(st.updated).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})+(G.overflow?` · ${G.overflow} ${X('weitere Repos ohne Platz','more repos without room')}`:'')}
  catch(e){s.textContent=X('Werkstadt · Collector nicht erreichbar','Werkstadt · collector not reachable')}}
if(['day','night'].includes(QS.get('time')))setMode(QS.get('time'));   // ?time=day|night legt die Ansicht fest
poll();setInterval(poll,5000);requestAnimationFrame(frame);
</script>
